x-deps: &common_deps
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_started
    elasticsearch:
      condition: service_started
    mongo:
      condition: service_started

x-backend-base: &backend_base
  <<: *common_deps
  profiles: [backend]
  pull_policy: never
  env_file:
    - .env
  networks:
    - app-network

services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports: ['5433:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    networks: ['app-network']

  redis:
    image: redis:latest
    restart: always
    ports: ['6379:6379']
    volumes: ['redis_data:/data']
    networks: ['app-network']

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.http.ssl.enabled=false
    ports: ['9200:9200']
    volumes: ['es_data:/usr/share/elasticsearch/data']
    networks: ['app-network']

  mongo:
    image: mongo:latest
    restart: always
    ports: ['27017:27017']
    volumes: ['mongo_data:/data/db']
    networks: ['app-network']

  backend_apps_nestjs_platform:
    <<: *backend_base
    build:
      context: .
      dockerfile: backend/apps/nestjs/platform/Dockerfile
    image: frontsoulend/backend_apps_nestjs_platform:local
    ports: ['3000:3000']
    environment:
      MONGO_URI: mongodb://mongo:27017
      DATABASE_URL: postgresql://user:password@postgres:5432/postgres?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200

volumes:
  postgres_data: {}
  redis_data: {}
  es_data: {}
  mongo_data: {}

networks:
  app-network: {}
